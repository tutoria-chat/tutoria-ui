name: Azure Dev

# The dashboard on Azure Container Apps (dev). Amplify keeps building this repo
# from git on its own; this workflow only adds the Azure copy, and only while
# deploy/dev.env says AZURE=true.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment): a moved tag can't change what runs with our Azure sign-in.

jobs:
  targets:
    name: Where to deploy
    runs-on: ubuntu-latest
    outputs:
      azure: ${{ steps.read.outputs.azure }}
      tenant: ${{ steps.read.outputs.tenant }}
      subscription: ${{ steps.read.outputs.subscription }}
      client: ${{ steps.read.outputs.client }}
      registry: ${{ steps.read.outputs.registry }}
      rg: ${{ steps.read.outputs.rg }}
      api_url: ${{ steps.read.outputs.api_url }}
      tutorials: ${{ steps.read.outputs.tutorials }}
      ai_api_url: ${{ steps.read.outputs.ai_api_url }}
      widget_url: ${{ steps.read.outputs.widget_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # deploy/dev.env: AZURE=true/false, the Azure ids and the build's public
      # settings (none are secrets). Changed by a commit, so the current value
      # is always visible.
      - name: Read deploy/dev.env
        id: read
        run: |
          test -f deploy/dev.env || { echo "::error::deploy/dev.env is missing (is it git-ignored?)"; exit 1; }
          get() { sed -n "s/^$1=//p" deploy/dev.env | tail -n1 | tr -d '\r'; }
          v=$(get AZURE); case "$v" in true|false) ;; *) echo "::error::AZURE in deploy file must be true or false, is '$v'"; exit 1 ;; esac
          {
            echo "azure=$(get AZURE)"
            echo "tenant=$(get AZURE_TENANT_ID)"
            echo "subscription=$(get AZURE_SUBSCRIPTION_ID)"
            echo "client=$(get AZURE_CLIENT_ID)"
            echo "registry=$(get AZURE_REGISTRY)"
            echo "rg=$(get AZURE_RESOURCE_GROUP)"
            echo "api_url=$(get NEXT_PUBLIC_API_BASE_URL)"
            echo "tutorials=$(get NEXT_PUBLIC_TUTORIALS_ENABLED)"
            echo "ai_api_url=$(get NEXT_PUBLIC_AI_API_URL)"
            echo "widget_url=$(get NEXT_PUBLIC_WIDGET_URL)"
          } | tee -a "$GITHUB_OUTPUT"

  check:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-checks too (lint runs in ci.yml).
      - name: Build
        run: npm run build

  deploy-azure:
    name: Build & Deploy to Azure Dev
    runs-on: ubuntu-latest
    needs: [check, targets]
    if: needs.targets.outputs.azure == 'true'
    concurrency:
      group: azure-dev-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC → the tutoria-github-dev identity's federated credential
    steps:
      # The URLs are baked into the bundle: an empty one would ship a
      # dashboard that calls nowhere.
      - name: Check build settings
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.targets.outputs.api_url }}
          NEXT_PUBLIC_AI_API_URL: ${{ needs.targets.outputs.ai_api_url }}
          NEXT_PUBLIC_WIDGET_URL: ${{ needs.targets.outputs.widget_url }}
        run: |
          missing=0
          for k in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_AI_API_URL NEXT_PUBLIC_WIDGET_URL; do
            [ -n "${!k}" ] || { echo "::error::$k is empty in deploy/dev.env"; missing=1; }
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ needs.targets.outputs.client }}
          tenant-id: ${{ needs.targets.outputs.tenant }}
          subscription-id: ${{ needs.targets.outputs.subscription }}

      - name: Build, push and roll out
        env:
          APP: tutoria-ui-dev
          IMAGE_NAME: tutoria-ui
          RG: ${{ needs.targets.outputs.rg }}
          REGISTRY: ${{ needs.targets.outputs.registry }}
          PORT: "3000"
          # Redirects to the login page (3xx) without a session.
          HEALTH: "/"
          BUILD_ARGS: |
            NEXT_PUBLIC_API_BASE_URL=${{ needs.targets.outputs.api_url }}
            NEXT_PUBLIC_AI_API_URL=${{ needs.targets.outputs.ai_api_url }}
            NEXT_PUBLIC_WIDGET_URL=${{ needs.targets.outputs.widget_url }}
            NEXT_PUBLIC_TUTORIALS_ENABLED=${{ needs.targets.outputs.tutorials }}
        run: bash deploy/azure-deploy.sh
